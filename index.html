<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kerepesi Zöldség Kft. — Minta felület (Étterem nézet)</title>

<link rel="shortcut icon" href="assets/favicon/favicon.ico">
<link rel="icon" href="assets/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="assets/tokens.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --kraft:#EDE6D6;
    --kraft-dark:#E1D6BA;
    --forest:#20402C;
    --forest-dark:#132A1B;
    --carrot:#DD7E0F;
    --carrot-dark:#B8660A;
    --tomato:#AE3A2C;
    --charcoal:#2A241D;
    --line:#CBBD97;
    --white:#FFFDF7;
    --font-display:'Oswald', sans-serif;
    --font-body:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--kraft);
    color:var(--charcoal);
    font-family:var(--font-body);
    min-height:100vh;
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size:16px 16px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--carrot);color:var(--white);}
  :focus-visible{outline:3px solid var(--carrot);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

  h1,h2,h3,.disp{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.02em;color:var(--forest-dark);}
  .mono{font-family:var(--font-mono);}

  .demo-banner{
    background:var(--carrot);color:var(--white);text-align:center;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;
    font-size:12.5px;padding:8px 10px;
    position:sticky;top:0;z-index:50;
  }
  .demo-banner b{text-decoration:underline;}

  .topbar{
    background:var(--forest);color:var(--kraft);padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:4px solid var(--forest-dark);position:sticky;top:32px;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:44px;height:44px;border-radius:50%;border:2px solid var(--kraft);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:15px;
    transform:rotate(-6deg);flex-shrink:0;
  }
  .brand-text .t1{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--kraft);line-height:1.1;}
  .brand-text .t2{font-size:11px;color:var(--kraft-dark);letter-spacing:.08em;text-transform:uppercase;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .who{font-size:13px;color:var(--kraft-dark);text-align:right;line-height:1.3;}
  .who b{color:var(--kraft);display:block;font-size:14px;}

  .btn{border:none;border-radius:var(--radius);padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-carrot{background:var(--carrot);color:var(--white);}
  .btn-carrot:hover{background:var(--carrot-dark);}
  .btn-outline{background:transparent;border:2px solid currentColor;color:var(--kraft);}
  .btn-outline:hover{background:rgba(255,255,255,.08);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  main{width:100%;max-width:1180px;margin:0 auto;padding:18px 16px 100px;}

  .stamp{display:inline-flex;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:50%;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;font-size:10.5px;transform:rotate(-4deg);white-space:nowrap;}
  .stamp-cat{color:var(--forest);border-color:var(--forest);border-radius:14px;background:rgba(32,64,44,.05);}
  .stamp-tier-bronz{color:#8A5A2B;border-color:#8A5A2B;background:rgba(138,90,43,.08);}
  .stamp-tier-ezust{color:#5B6470;border-color:#5B6470;background:rgba(91,100,112,.08);}
  .stamp-tier-arany{color:#9C7A12;border-color:#9C7A12;background:rgba(156,122,18,.1);}

  .sold-out-stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-11deg);border:3px solid var(--tomato);color:var(--tomato);font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 14px;border-radius:4px;background:rgba(255,253,247,.85);font-size:14px;pointer-events:none;}

  .tier-banner{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;flex-wrap:wrap;}
  .tier-banner .tb-text{font-size:13px;color:#5c5344;}
  .tier-banner .tb-text b{color:var(--forest-dark);}

  .progress-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
  .progress-track{position:relative;height:10px;background:var(--kraft-dark);border-radius:6px;margin:10px 0 6px;overflow:hidden;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--carrot),var(--carrot-dark));border-radius:6px;transition:width .4s ease;}
  .progress-labels{display:flex;justify-content:space-between;font-size:11px;color:#7a705c;font-family:var(--font-mono);}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;}
  .chip{flex-shrink:0;border:1.5px solid var(--forest);color:var(--forest);background:var(--white);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;}
  .chip.active{background:var(--forest);color:var(--kraft);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .card{position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 rgba(0,0,0,.02);}
  .card.out{opacity:.55;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .card h3{font-size:16px;margin:0;line-height:1.15;color:var(--charcoal);text-transform:none;letter-spacing:0;font-weight:600;font-family:var(--font-body);}
  .price-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
  .price{font-family:var(--font-mono);font-weight:600;font-size:17px;color:var(--forest-dark);}
  .price-orig{font-family:var(--font-mono);font-size:12.5px;color:#9a8f79;text-decoration:line-through;}
  .unit{font-size:12px;color:#7a705c;}
  .qty-row{display:flex;align-items:center;gap:8px;margin-top:auto;}
  .qty-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--forest);background:var(--white);color:var(--forest);font-size:16px;line-height:1;font-weight:700;}
  .qty-input{width:52px;text-align:center;padding:6px 4px;border:1.5px solid var(--line);border-radius:5px;font-family:var(--font-mono);}

  .cart-fab{position:fixed;bottom:18px;right:18px;z-index:60;background:var(--carrot);color:var(--white);border:none;border-radius:30px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;}
  .cart-panel{position:fixed;inset:auto 0 0 0;background:var(--white);border-top:3px solid var(--forest);border-radius:16px 16px 0 0;max-height:82vh;overflow-y:auto;z-index:70;transform:translateY(105%);transition:transform .25s ease;padding:18px 18px 24px;box-shadow:0 -10px 30px rgba(0,0,0,.25);}
  .cart-panel.open{transform:translateY(0);}
  .cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .cart-head h2{font-size:18px;margin:0;}
  .close-cart{background:none;border:none;font-size:22px;color:var(--charcoal);}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px;}
  .cart-item .ci-name{font-weight:600;font-size:14px;}
  .cart-item .ci-sub{font-size:12px;color:#7a705c;}
  .cart-item .ci-remove{background:none;border:none;color:var(--tomato);font-size:13px;font-weight:600;}
  .cart-totals{margin-top:14px;font-size:14px;}
  .cart-totals .row{display:flex;justify-content:space-between;padding:4px 0;}
  .cart-totals .row.grand{font-weight:700;font-size:17px;border-top:2px solid var(--forest);margin-top:6px;padding-top:8px;font-family:var(--font-mono);}
  .coupon-row{display:flex;gap:8px;margin:12px 0;}
  .coupon-row input{flex:1;padding:9px 10px;border:1.5px solid var(--line);border-radius:5px;text-transform:uppercase;font-family:var(--font-mono);}
  .empty-note{color:#7a705c;font-size:14px;padding:20px 0;text-align:center;}
  .coupon-hint{font-size:11.5px;color:#7a705c;margin:-6px 0 8px;}

  @media (min-width:900px){
    .cart-fab{display:none;}
    main{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start;}
    main .content-col{grid-column:1;}
    .cart-panel{position:sticky;top:110px;grid-column:2;transform:none;max-height:calc(100vh - 130px);border-radius:12px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.06);}
    .close-cart{display:none;}
  }

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--forest-dark);color:var(--kraft);padding:12px 20px;border-radius:8px;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:all .25s ease;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .confirm-overlay{position:fixed;inset:0;background:rgba(19,42,27,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .confirm-overlay.show{opacity:1;pointer-events:auto;}
  .confirm-card{background:var(--white);border-radius:12px;max-width:380px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .confirm-card .check{font-size:40px;margin-bottom:8px;}
  .confirm-card h2{font-size:19px;margin:0 0 8px;}
  .confirm-card p{font-size:14px;color:#5c5344;margin:0 0 18px;}
</style>
</head>
<body>

<div class="demo-banner">🎬 Ez egy <b>minta / demo</b> felület bemutatásra — valós rendelés és fiók nem jön létre</div>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge">KZ</div>
    <div class="brand-text">
      <div class="t1">Kerepesi Zöldség</div>
      <div class="t2">Kft.</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="who"><b>Minta Étterem Kft.</b>minta@etterem.hu</div>
  </div>
</div>

<main>
  <div class="content-col">
    <div class="tier-banner" id="tierBanner"></div>
    <div class="progress-wrap" id="progressWrap"></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="cart-panel" id="cartPanel"></div>
</main>

<button class="cart-fab" id="cartFab" onclick="toggleCart(true)">🧺 Kosár <span id="fabCount"></span></button>

<div class="toast" id="toast"></div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="check">✅</div>
    <h2>Rendelés leadva!</h2>
    <p id="confirmText">Köszönjük a rendelést. Ez egy demó, így most nem történt valódi rendelés.</p>
    <button class="btn btn-carrot" style="width:100%;justify-content:center;" onclick="closeConfirm()">Rendben</button>
  </div>
</div>

<script>
/* ============================================================
   MINTA ADATOK — ez egy bemutató (nincs Firebase, nincs backend)
   ============================================================ */
const products = {
  p1:  {nev:'Paradicsom', egyseg:'kg', ar:890,  kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p2:  {nev:'Uborka',     egyseg:'kg', ar:650,  kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p3:  {nev:'Vöröshagyma',egyseg:'kg', ar:390,  kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p4:  {nev:'Fokhagyma',  egyseg:'kg', ar:2400, kategoria:'zöldség', kedvezmeny:10, keszleten:true},
  p5:  {nev:'Sárgarépa',  egyseg:'kg', ar:340,  kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p6:  {nev:'Kápia paprika', egyseg:'kg', ar:1290, kategoria:'zöldség', kedvezmeny:0, keszleten:false},
  p7:  {nev:'Burgonya',   egyseg:'láda', ar:4200,kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p8:  {nev:'Jégsaláta',  egyseg:'db', ar:420,  kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p9:  {nev:'Cukkini',    egyseg:'kg', ar:590,  kategoria:'zöldség', kedvezmeny:0,  keszleten:true},
  p10: {nev:'Citrom',     egyseg:'kg', ar:990,  kategoria:'gyümölcs', kedvezmeny:0, keszleten:true},
  p11: {nev:'Alma',       egyseg:'kg', ar:520,  kategoria:'gyümölcs', kedvezmeny:0, keszleten:true},
  p12: {nev:'Görögdinnye',egyseg:'db', ar:2200, kategoria:'gyümölcs', kedvezmeny:15,keszleten:true},
  p13: {nev:'Petrezselyemzöld', egyseg:'köteg', ar:290, kategoria:'fűszernövény', kedvezmeny:0, keszleten:true},
  p14: {nev:'Bazsalikom', egyseg:'köteg', ar:390, kategoria:'fűszernövény', kedvezmeny:0, keszleten:true},
  p15: {nev:'Kapor',      egyseg:'köteg', ar:290, kategoria:'fűszernövény', kedvezmeny:0, keszleten:false},
};

const tiers = [
  {nev:'Bronz',  kuszobFt:300000,  kedvezmenySzazalek:5},
  {nev:'Ezüst',  kuszobFt:800000,  kedvezmenySzazalek:10},
  {nev:'Arany',  kuszobFt:1500000, kedvezmenySzazalek:15},
];

const restaurant = {
  nev:'Minta Étterem Kft.',
  kedvezmeny:0,          // egyedi admin kedvezmény (most nincs beállítva)
  osszesRendelt:650000,  // eddig összesen rendelt érték
};

const coupons = {
  'NYARI10': {tipus:'szazalek', ertek:10, hatokor:'mindenki', termekId:null, ervenyesEddig:null, aktiv:true},
  'FOKHAGYMA20': {tipus:'szazalek', ertek:20, hatokor:'mindenki', termekId:'p4', ervenyesEddig:null, aktiv:true},
};

/* ============================================================
   ÁLLAPOT
   ============================================================ */
let cart = [];
let activeCategory = 'Mind';

function fmtFt(n){ return Math.round(n||0).toLocaleString('hu-HU') + ' Ft'; }
function round(n){ return Math.round((n||0)*100)/100; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

function sortedTiers(){ return [...tiers].sort((a,b)=>a.kuszobFt-b.kuszobFt); }
function tierClass(nev){
  const n=(nev||'').toLowerCase();
  if(n.includes('arany')) return 'stamp-tier-arany';
  if(n.includes('ezüst')||n.includes('ezust')) return 'stamp-tier-ezust';
  return 'stamp-tier-bronz';
}
function getCurrentTier(osszesRendelt){
  let current = null;
  for(const t of sortedTiers()){ if(osszesRendelt >= t.kuszobFt) current = t; }
  return current;
}
function nextTier(osszesRendelt){
  for(const t of sortedTiers()){ if(osszesRendelt < t.kuszobFt) return t; }
  return null;
}
function effectiveDiscountPct(){
  const tier = getCurrentTier(restaurant.osszesRendelt);
  return Math.max(restaurant.kedvezmeny||0, tier ? tier.kedvezmenySzazalek : 0);
}
function productUnitPrice(p){ return round(p.ar * (1-(p.kedvezmeny||0)/100)); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  renderTierBanner();
  renderProgress();
  renderChips();
  renderGrid();
  renderCart();
  document.getElementById('fabCount').textContent = cart.length ? '· '+cart.reduce((s,c)=>s+c.mennyiseg,0)+' tétel' : '';
}

function renderTierBanner(){
  const tier = getCurrentTier(restaurant.osszesRendelt);
  const discPct = effectiveDiscountPct();
  document.getElementById('tierBanner').innerHTML = `
    ${tier ? `<span class="stamp ${tierClass(tier.nev)}">${esc(tier.nev)} szint · ${tier.kedvezmenySzazalek}%</span>` : ''}
    <span class="tb-text">${discPct>0 ? `Jelenlegi kedvezményed <b>${discPct}%</b> minden rendelésen.` : 'Még nincs aktív kedvezményed — rendelj, hogy törzsvásárlói szintet érj el!'}</span>
  `;
}

function renderProgress(){
  const next = nextTier(restaurant.osszesRendelt);
  const wrap = document.getElementById('progressWrap');
  if(!next){
    wrap.innerHTML = `<div class="tb-text" style="font-size:13px;">🏆 Elérted a legmagasabb törzsvásárlói szintet!</div>`;
    return;
  }
  const prevThreshold = [...sortedTiers()].reverse().find(t=>t.kuszobFt<=restaurant.osszesRendelt);
  const base = prevThreshold ? prevThreshold.kuszobFt : 0;
  const pct = Math.min(100, Math.round(((restaurant.osszesRendelt-base)/(next.kuszobFt-base))*100));
  wrap.innerHTML = `
    <div class="tb-text">Eddig összesen rendelve: <b class="mono">${fmtFt(restaurant.osszesRendelt)}</b> — még <b>${fmtFt(next.kuszobFt-restaurant.osszesRendelt)}</b> a(z) <b>${esc(next.nev)}</b> szintig (${next.kedvezmenySzazalek}% kedvezmény)</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-labels"><span>${fmtFt(base)}</span><span>${fmtFt(next.kuszobFt)}</span></div>
  `;
}

function renderChips(){
  const categories = ['Mind', ...new Set(Object.values(products).map(p=>p.kategoria))];
  document.getElementById('chips').innerHTML = categories.map(c=>
    `<button class="chip ${c===activeCategory?'active':''}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`
  ).join('');
}

function renderGrid(){
  const discPct = effectiveDiscountPct();
  const entries = Object.entries(products).filter(([id,p])=>activeCategory==='Mind'||p.kategoria===activeCategory);
  document.getElementById('grid').innerHTML = entries.map(([id,p])=>{
    const unitPrice = productUnitPrice(p);
    const finalPrice = round(unitPrice*(1-discPct/100));
    const showOrig = discPct>0 || (p.kedvezmeny||0)>0;
    const inCart = cart.find(c=>c.termekId===id);
    const qty = inCart ? inCart.mennyiseg : 0;
    return `
      <div class="card ${p.keszleten===false?'out':''}">
        ${p.keszleten===false ? '<div class="sold-out-stamp">Elfogyott</div>' : ''}
        <div class="card-top">
          <h3>${esc(p.nev)}</h3>
          <span class="stamp stamp-cat">${esc(p.kategoria)}</span>
        </div>
        <div class="price-row">
          <span class="price">${fmtFt(finalPrice)}</span>
          ${showOrig ? `<span class="price-orig">${fmtFt(p.ar)}</span>` : ''}
          <span class="unit">/ ${esc(p.egyseg)}</span>
        </div>
        <div class="qty-row">
          <button class="qty-btn" ${p.keszleten===false?'disabled':''} onclick="changeQty('${id}',-1)">−</button>
          <input class="qty-input mono" type="number" min="0" step="1" value="${qty}" ${p.keszleten===false?'disabled':''} onchange="setQty('${id}', this.value)">
          <button class="qty-btn" ${p.keszleten===false?'disabled':''} onclick="changeQty('${id}',1)">+</button>
        </div>
      </div>`;
  }).join('');
}

function setCategory(c){ activeCategory=c; render(); }
function changeQty(id, delta){
  const existing = cart.find(c=>c.termekId===id);
  if(existing){
    existing.mennyiseg = Math.max(0, existing.mennyiseg+delta);
    if(existing.mennyiseg===0) cart = cart.filter(c=>c.termekId!==id);
  } else if(delta>0){
    cart.push({termekId:id, mennyiseg:1});
  }
  render();
}
function setQty(id, val){
  const n = Math.max(0, Math.floor(Number(val)||0));
  cart = cart.filter(c=>c.termekId!==id);
  if(n>0) cart.push({termekId:id, mennyiseg:n});
  render();
}
function toggleCart(open){
  const panel = document.getElementById('cartPanel');
  if(window.innerWidth>=900) return;
  panel.classList.toggle('open', open);
}

function computeTotals(couponCodeRaw){
  const discPct = effectiveDiscountPct();
  let reszosszeg = 0;
  const tetelek = cart.map(c=>{
    const p = products[c.termekId];
    const egysegAr = productUnitPrice(p);
    const tetelOsszeg = round(egysegAr*c.mennyiseg);
    reszosszeg += tetelOsszeg;
    return {termekId:c.termekId, nev:p.nev, egyseg:p.egyseg, egysegAr, mennyiseg:c.mennyiseg, tetelOsszeg};
  });
  const kedvezmenyOsszeg = round(reszosszeg*discPct/100);
  const afterDiscount = round(reszosszeg-kedvezmenyOsszeg);

  let kuponOsszeg=0, kuponKod=(couponCodeRaw||'').trim().toUpperCase(), couponError=null, coupon=null;
  if(kuponKod){
    coupon = coupons[kuponKod];
    if(!coupon || coupon.aktiv===false){
      couponError='Érvénytelen kuponkód.'; kuponKod='';
    } else if(coupon.termekId){
      const tetel = tetelek.find(t=>t.termekId===coupon.termekId);
      if(tetel){ kuponOsszeg = coupon.tipus==='szazalek' ? round(tetel.tetelOsszeg*coupon.ertek/100) : Math.min(coupon.ertek,tetel.tetelOsszeg); }
      else { couponError='Ez a kupon egy olyan termékre vonatkozik, ami nincs a kosaradban.'; kuponKod=''; }
    } else {
      kuponOsszeg = coupon.tipus==='szazalek' ? round(afterDiscount*coupon.ertek/100) : Math.min(coupon.ertek, afterDiscount);
    }
  }
  const vegosszeg = round(afterDiscount-kuponOsszeg);
  return {tetelek, reszosszeg, discPct, kedvezmenyOsszeg, kuponKod, kuponOsszeg, vegosszeg, couponError};
}

function renderCart(){
  const couponVal = document.getElementById('couponInput') ? document.getElementById('couponInput').value : '';
  const totals = computeTotals(couponVal);
  const itemsHtml = totals.tetelek.length ? totals.tetelek.map(t=>`
    <div class="cart-item">
      <div>
        <div class="ci-name">${esc(t.nev)}</div>
        <div class="ci-sub mono">${t.mennyiseg} ${esc(t.egyseg)} × ${fmtFt(t.egysegAr)}</div>
      </div>
      <div style="text-align:right;">
        <div class="mono">${fmtFt(t.tetelOsszeg)}</div>
        <button class="ci-remove" onclick="setQty('${t.termekId}',0)">eltávolít</button>
      </div>
    </div>`).join('') : '<div class="empty-note">A kosarad üres.<br>Válassz termékeket a listából.</div>';

  document.getElementById('cartPanel').innerHTML = `
    <div class="cart-head"><h2>Kosár</h2><button class="close-cart" onclick="toggleCart(false)">✕</button></div>
    ${itemsHtml}
    <div class="coupon-row"><input id="couponInput" placeholder="KUPONKÓD" value="${esc(couponVal)}" oninput="render()"></div>
    <div class="coupon-hint">Próbáld ki: <b class="mono">NYARI10</b> (10% mindenre) vagy <b class="mono">FOKHAGYMA20</b> (csak fokhagymára)</div>
    ${totals.couponError ? `<div style="color:var(--tomato);font-size:13px;margin-bottom:6px;">${esc(totals.couponError)}</div>` : ''}
    <div class="cart-totals">
      <div class="row"><span>Részösszeg</span><span class="mono">${fmtFt(totals.reszosszeg)}</span></div>
      ${totals.discPct>0 ? `<div class="row"><span>Kedvezmény (${totals.discPct}%)</span><span class="mono">−${fmtFt(totals.kedvezmenyOsszeg)}</span></div>` : ''}
      ${totals.kuponOsszeg>0 ? `<div class="row"><span>Kupon (${esc(totals.kuponKod)})</span><span class="mono">−${fmtFt(totals.kuponOsszeg)}</span></div>` : ''}
      <div class="row grand"><span>Végösszeg</span><span>${fmtFt(totals.vegosszeg)}</span></div>
    </div>
    <button class="btn btn-carrot" style="width:100%;justify-content:center;margin-top:14px;" ${totals.tetelek.length?'':'disabled'} onclick="submitOrder()">Rendelés leadása</button>
  `;
}

function submitOrder(){
  const couponVal = document.getElementById('couponInput') ? document.getElementById('couponInput').value : '';
  const totals = computeTotals(couponVal);
  if(!totals.tetelek.length){ toast('A kosár üres.'); return; }
  document.getElementById('confirmText').textContent =
    `${totals.tetelek.length} tétel, végösszeg ${fmtFt(totals.vegosszeg)}. Ez egy demó, így most nem történt valódi rendelés.`;
  document.getElementById('confirmOverlay').classList.add('show');
  cart = [];
  toggleCart(false);
  render();
}
function closeConfirm(){ document.getElementById('confirmOverlay').classList.remove('show'); }

render();
</script>
</body>
</html>
